services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120 --reload
    env_file: ../.env
    ports:
      - "8000:8000"
    volumes:
      - ..:/app
    depends_on:
      - db
      - redis

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: celery -A config.celery worker -l info -Q default,ai,shopify,low -c 4
    env_file: ../.env
    volumes:
      - ..:/app
    depends_on:
      - db
      - redis

  beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: celery -A config.celery beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: ../.env
    volumes:
      - ..:/app
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mosaiq
      POSTGRES_USER: mosaiq
      POSTGRES_PASSWORD: mosaiq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
