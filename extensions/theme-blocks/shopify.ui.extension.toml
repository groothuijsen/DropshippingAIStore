# Shopify Theme App Extension configuration
# See docs/04-extensions.md §1

api_version = "2026-07"

[extensions]
name = "Mosaiq"
handle = "mosaiq-theme-extension"

[[extensions.targeting]]
target = "sections"
input_query = "sections"

  [[extensions.targeting.schema]]
  name = "page_type"
  type = "single_line_text_field"

  [[extensions.targeting.schema]]
  name = "metaobject_handle"
  type = "single_line_text_field"
