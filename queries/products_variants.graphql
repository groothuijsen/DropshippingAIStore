query ProductsVariants($first: Int!, $after: String) {
  products(first: $first, after: $after, query: "status:active") {
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      id
      variants(first: 100) {
        nodes {
          id
          price
          compareAtPrice
          sku
        }
      }
    }
  }
}
