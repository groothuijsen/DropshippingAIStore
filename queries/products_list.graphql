query ProductsList($first: Int!, $after: String) {
  products(first: $first, after: $after) {
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      id
      title
      createdAt
      handle
      vendor
      tags
      status
      featuredMedia {
        ... on MediaImage {
          image {
            url
            altText
          }
        }
      }
    }
  }
}
