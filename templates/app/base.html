{% load i18n static %}
<!DOCTYPE html>
<html lang="{{ ui_locale|default:'en' }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="shopify-api-key" content="{{ shopify_api_key }}">
    <title>{% trans "Mosaiq" %}</title>
    <script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"
            data-api-key="{{ shopify_api_key }}"></script>
    <script type="module" src="{% static 'app/auth.js' %}"></script>
    <style>
        /* Polaris-compatible base styles */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #202223; background: #f4f6f8; }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}
    {% block scripts %}{% endblock %}
</body>
</html>
