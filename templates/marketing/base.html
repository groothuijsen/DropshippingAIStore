<!doctype html>
{% load static i18n %}
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description }}">
  <meta property="og:title" content="{{ page.title }}">
  <meta property="og:description" content="{{ page.description }}">
  <meta property="og:image" content="{% static 'marketing/og/home-1200x630.png' %}">
  {% with canon="https://shopify.mosaiq.marketing" %}<link rel="canonical" href="{{ canon }}{{ page.slug }}">
  {% for alt in page.alts %}<link rel="alternate" hreflang="{{ alt.0 }}" href="{{ canon }}{{ alt.1 }}">{% endfor %}
  <link rel="alternate" hreflang="x-default" href="{{ canon }}{{ page.slug }}">
  <script type="application/ld+json">{{ page.jsonld|safe }}</script>{% endwith %}
  <link rel="stylesheet" href="{% static 'marketing/css/fonts.css' %}">
  <link rel="stylesheet" href="{% static 'marketing/css/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'marketing/css/site.css' %}">
</head>
<body>
<nav class="nav shell"><div class="logo">Mosaiq<span class="acc">.app</span></div>
<div class="nav-links"><a href="{% url 'marketing:features' %}">Features</a><a href="{% url 'marketing:pricing' %}">Pricing</a><a href="{% url 'marketing:eu_compliance' %}">EU compliance</a></div>
<a class="btn btn-p" href="{% url 'marketing:early_access' %}">{% trans "Get early access" %}</a></nav>
{% block content %}{% endblock %}
<footer class="footer"><div class="shell">Mosaiq · Amsterdam · hello@mosaiq.marketing</div></footer>
<script>(function(){try{var d=location;if(d.protocol!=="https:"&&d.protocol!=="http:")return;new Image().src="/t.gif?p="+encodeURIComponent(d.pathname)+"&r="+encodeURIComponent(document.referrer||"")+"&l="+encodeURIComponent("{{ lang }}");}catch(e){}})();</script>
</body>
</html>
